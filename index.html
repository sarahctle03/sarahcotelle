<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sarah Cotelle</title>
    <meta name="description" content="Sarah Cotelle – Portfolio">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        html {
            font-size: clamp(14px, 1vw, 20px);
        }

        body {
            margin: 0;
            background: #fff;
            color: #000;
            font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 600;
            line-height: 1.2;
            min-height: 100vh;
            min-height: 100svh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover { opacity: .6; }
        a:active { opacity: .7; }

        /* En-tête */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1.15rem 1.5rem;
            background: #fff;
        }

        header > * {
            flex: 1;
        }

        header .left  { text-align: left; }
        header .mid   { text-align: center; }
        header .right { text-align: right; }

        /* Zone principale : image centrée */
        main {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 1.5rem 2.5rem;
        }

        .work {
            margin: 0;
            width: min(54vw, calc((100svh - 9rem) * 1.5));
        }

        .work img {
            display: block;
            width: 100%;
            height: auto;
            border: 0.1rem solid rgba(0, 0, 0, 0.2);
            border-radius: 0.3rem;
            filter: drop-shadow(0.3rem 0.3rem 0.5rem rgba(0, 0, 0, 0.12));
        }

        /* Téléphone : image pleine largeur, collée en bas */
        @media (max-width: 700px) {
            header {
                padding: 3.2vw 4vw;
                font-size: 0.95rem;
            }

            main {
                align-items: flex-end;
                padding: 4.5rem 0 0;
            }

            .work {
                width: 100%;
                padding: 0 3.2vw 3.2vw;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="left">Sarah Cotelle</div>
        <div class="right">
            <a href="https://drive.google.com/file/d/15cnKFsxnYmzkdlR2qfeiKYkrTRwB7uWB/view" target="_blank" rel="noopener">portfolio</a>&nbsp;&nbsp;
            <a href="mailto:sarah.cotelle@hotmail.com">email</a>&nbsp;&nbsp;
            <a href="https://www.instagram.com/cotellesarah/" target="_blank" rel="noopener">ig</a>
        </div>
    </header>

    <main>
        <figure class="work">
            <img src="image-2400.jpg"
                 srcset="image-1200.jpg 1200w, image-2400.jpg 2400w"
                 sizes="(max-width: 700px) 100vw, 54vw">
        </figure>
    </main>
</body>
</html>
